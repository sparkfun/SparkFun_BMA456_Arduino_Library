name=SparkFun BMA456 Arduino Library
version=1.0.0
author=SparkFun Electronics <techsupport@sparkfun.com>
maintainer=SparkFun Electronics <https://www.sparkfun.com>
sentence=An Arduino library for the SparkFun Qwiic BMA456 breakout, built on the Bosch BMA456 16-bit triaxial accelerometer.
paragraph=Drives the Bosch BMA456 over I2C or SPI through the SparkFun Toolkit, wrapping Bosch's BMA456 SensorAPI the way the SparkFun BMA400 library wraps the BMA400 API. Provides acceleration, sensor timestamps and die temperature, output data rate, range, filter and power control, both interrupt pins, the 1 kB FIFO, and the on-chip feature engine with a choice of two Bosch configurations - BMA456H (step counter, step detector, activity, single/double/triple tap, any/no-motion, auto low power) or BMA456MM (orientation, high-g, low-g, significant motion, tap, any/no-motion, auto low power) - plus axis remapping, self-test and fast offset compensation. The feature configuration is kept in program memory, so it runs on an ATmega328P.
category=Sensors
url=https://github.com/sparkfun/SparkFun_BMA456_Arduino_Library
architectures=*
depends=SparkFun Toolkit (>=1.2.0)
includes=SparkFun_BMA456.h
